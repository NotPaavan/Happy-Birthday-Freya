<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday Freya!</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=49">
</head>
<body>
  <!-- The cut-out figure tucked behind the birthday lettering; it sits under
       the whole card, so the lettering covers its lower half. -->
  <div class="peek" aria-hidden="true">
    <img src="assets/soldier.png" alt="">
  </div>

  <!-- The second cut-out, standing behind the y of BIRTHDAY on the other side,
       leaning the other way to follow the arc of HAPPY. -->
  <div class="peek peek-y" aria-hidden="true">
    <img src="assets/peek-y.png" alt="">
  </div>

  <main class="stage">
    <div class="card">
      <img class="birthday" src="assets/happy-birthday.png" alt="Happy birthday">

      <img class="starpage" src="assets/starpage-clean.png" alt="Paper card with gold stars">

      <img class="mainphoto" src="assets/mainphoto-torn.webp" alt="A photo of us dancing, torn out along its edges">

      <img class="favorite" src="assets/favorite-person.png" alt="Favorite person, with an arrow pointing at the girl's head">

      <img class="camera" src="assets/camera.png" alt="Camera showing a photo of us">

      <img class="snoopy" src="assets/snoopy.webp" alt="Snoopy in a witch hat, resting on top of the camera">

      <a class="heartnote" href="notes.html" aria-label="Open the note pages">
        <img src="assets/heartnote-stroke.png?v=4" alt="Heart note: darling, you are all i ever wanted love to be.">
        <!-- The word riding above the heart, with an arrow curling down at it. -->
        <span class="noteslabel" aria-hidden="true">
          <span>notes</span>
          <svg class="notes-arrow" viewBox="0 0 24 44" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <g stroke="#81201a" stroke-width="3.7">
              <path d="M14.5 3c-3.2 9.6-4.8 17.6-5.8 26.6" vector-effect="non-scaling-stroke"/>
              <path d="M3.6 24.4 8.6 31.8l6.4-6.6" vector-effect="non-scaling-stroke"/>
            </g>
            <g stroke="#f3ddb4" stroke-width="1.9">
              <path d="M14.5 3c-3.2 9.6-4.8 17.6-5.8 26.6" vector-effect="non-scaling-stroke"/>
              <path d="M3.6 24.4 8.6 31.8l6.4-6.6" vector-effect="non-scaling-stroke"/>
            </g>
          </svg>
        </span>
      </a>

      <!-- The word beside the record, with an arrow curling down onto it. -->
      <span class="playlistlabel" aria-hidden="true">
        <span>playlist</span>
        <svg class="playlist-arrow" viewBox="0 0 24 44" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g stroke="#81201a" stroke-width="3.7">
            <path d="M17.5 2c.5 10-3.4 20-10.6 27.6" vector-effect="non-scaling-stroke"/>
            <path d="M2.6 24.4 7.6 32.4l7.2-5.8" vector-effect="non-scaling-stroke"/>
          </g>
          <g stroke="#f3ddb4" stroke-width="1.9">
            <path d="M17.5 2c.5 10-3.4 20-10.6 27.6" vector-effect="non-scaling-stroke"/>
            <path d="M2.6 24.4 7.6 32.4l7.2-5.8" vector-effect="non-scaling-stroke"/>
          </g>
        </svg>
      </span>

      <a class="record"
         href="https://open.spotify.com/playlist/6lRnrzRGHlbf0EiQtbP55W?si=cc2f0e2c9fbf47df&amp;pt=5d52f1a93b9e3aa7f9213442bfca0ef4"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Open the playlist on Spotify">
        <img src="assets/record.png" alt="">
      </a>

      <a class="filmstrip" href="strip.html" aria-label="Open the star page">
        <img src="assets/filmstrip.png?v=2" alt="A strip of three photobooth photos">
        <!-- The handwriting over the strip, with an arrow hanging down at it. -->
        <span class="striplabel" aria-hidden="true">
          <span>photobooth</span>
          <svg class="strip-arrow" viewBox="0 0 14 30" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <g stroke="#81201a" stroke-width="3.7">
              <path d="M7 2c0 7 .9 13 .2 19" vector-effect="non-scaling-stroke"/>
              <path d="M2.3 15.4 7.2 21.4l4.6-6" vector-effect="non-scaling-stroke"/>
            </g>
            <g stroke="#f3ddb4" stroke-width="1.9">
              <path d="M7 2c0 7 .9 13 .2 19" vector-effect="non-scaling-stroke"/>
              <path d="M2.3 15.4 7.2 21.4l4.6-6" vector-effect="non-scaling-stroke"/>
            </g>
          </svg>
        </span>
      </a>
    </div>
  </main>

  <img class="snoopynap" src="assets/snoopy-nap.png" alt="Snoopy asleep on a heap of autumn leaves">

</body>
</html>
