<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" href="favicon.ico" sizes="48x48">

  <main class="stage">

      <img class="paper" src="assets/starpage-landscape.png" alt="A blank landscape page of the scrapbook paper">
